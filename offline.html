<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — CSO-NORSU Portal</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f4f6f2; color:#20332a; }
  main { width:min(100%, 440px); padding:clamp(24px, 6vw, 40px); box-sizing:border-box; border:1px solid #d8e0d8; border-radius:6px; background:#fff; }
  h1 { margin:0 0 10px; font-family:Georgia, "Times New Roman", serif; font-size:clamp(1.7rem, 7vw, 2.1rem); font-weight:500; }
  p  { color:#59685e; line-height:1.6; margin:0 0 20px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:4px; border:1px solid #31563d; background:#31563d; color:#fff; min-height:44px; cursor:pointer; }
  button:focus-visible { outline:3px solid #31563d; outline-offset:3px; }
  @media (prefers-color-scheme: dark) { body { background:#111814; color:#edf2ed; } main { border-color:#35443a; background:#19221c; } p { color:#b3c0b6; } button { background:#52795a; border-color:#52795a; } }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page was not saved on your phone yet. The Campus Map and Curriculum open offline after you have visited them once. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
